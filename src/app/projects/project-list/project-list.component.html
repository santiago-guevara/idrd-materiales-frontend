<div class="container">

  <div class="header">
    <h1>Proyectos</h1>

    <button
      mat-flat-button
      (click)="createProject()"
    >
      Nuevo proyecto
    </button>
  </div>

  <table
    mat-table
    [dataSource]="projects"
    class="mat-elevation-z2"
  >

    <!-- Nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>
        Nombre
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.name }}
      </td>
    </ng-container>

    <!-- Departamento -->
    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef>
        Departamento
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.city.department.name }}
      </td>
    </ng-container>

    <!-- Ciudad -->
    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef>
        Ciudad
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.city.name }}
      </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        Acciones
      </th>

      <td mat-cell *matCellDef="let project">

        <button
          mat-button
          (click)="editProject(project.id)"
        >
          Editar
        </button>

        <button
          mat-button
          (click)="deleteProject(project.id)"
        >
          Eliminar
        </button>

        <button
          mat-button
          (click)="manageMaterials(project.id)"
        >
          Materiales
        </button>

        <button
          mat-button
          (click)="viewReport(project.id)"
        >
          Reporte
        </button>

      </td>
    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns"
    ></tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
    ></tr>

  </table>

</div>
